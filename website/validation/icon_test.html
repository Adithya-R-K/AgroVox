<!DOCTYPE html><html><head><style>
body{background:#fff; display:flex; flex-wrap:wrap; gap:16px; padding:20px; font-family:sans-serif;}
.cell{display:flex; flex-direction:column; align-items:center; gap:6px; width:80px;}
svg{color:#173626;}
</style></head><body>
<script>
const ICON_PATHS = {
  translate: '<circle cx="9" cy="12" r="7"/><circle cx="15" cy="12" r="7"/>',
  globe: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/>',
  tag: '<polygon points="3,7 13,7 20,12 13,17 3,17"/><circle cx="8" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>',
  entity: '<path d="M7 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 0 1 5.2 1c0 1.9-2.3 2.1-2.5 3.6"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/>',
  leaf: '<path d="M5 21c8 0 14-6 14-14V4h-3C8 4 4 10 4 18v3z"/><path d="M5 21c3-6 6-9 11-13"/>',
  sprout: '<path d="M7 20h10"/><path d="M12 20V10"/><path d="M12 10C8 10 5 7 5 4c3 0 6 2 7 5"/><path d="M12 10c3 0 6-2 7-5-3 0-6 2-7 5"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  sliders: '<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  barchart: '<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="12" width="3" height="8"/><rect x="11" y="7" width="3" height="13"/><rect x="16" y="3" width="3" height="17"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 15.9 8H16a4.5 4.5 0 0 1 .5 9H7z"/>',
  check: '<polyline points="4,13 9,18 20,6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>',
  menu: '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>',
  close: '<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>',
  thumbsUp: '<path d="M9 21h8a2 2 0 0 0 2-2l1-6a2 2 0 0 0-2-2h-4l1-4a2 2 0 0 0-3.8-1L8 10"/><path d="M9 10v11H5V10h4z"/>',
  thumbsDown: '<path d="M9 3H5a2 2 0 0 0-2 2l-1 6a2 2 0 0 0 2 2h4l-1 4a2 2 0 0 0 3.8 1L14 14"/><path d="M15 14V3h4v11h-4z"/>',
  speaker: '<polygon points="4,10 8,10 12,6 12,18 8,14 4,14"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/>',
  clock: '<circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 16,14"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>',
  send: '<line x1="21" y1="3" x2="10" y2="14"/><polygon points="21,3 14,21 10,14 3,10"/>',
};

function icon(name, size){
  size = size || 20;
  const inner = ICON_PATHS[name] || "";
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
}
Object.keys(ICON_PATHS).forEach(name => {
  document.write('<div class="cell">'+icon(name, 32)+'<span style="font-size:11px;">'+name+'</span></div>');
});
</script>
</body></html>
